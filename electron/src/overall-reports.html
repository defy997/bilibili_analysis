<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态情感分析报告</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        /* Purple scrollbar, narrower (6px) for this page */
        :root {
            --scrollbar-thumb:       rgba(168, 85, 247, 0.3);
            --scrollbar-thumb-hover: rgba(168, 85, 247, 0.5);
        }
        .overflow-y-auto::-webkit-scrollbar { width: 6px; }
        .overflow-y-auto::-webkit-scrollbar-track { border-radius: 3px; }
        .overflow-y-auto::-webkit-scrollbar-thumb { border-radius: 3px; }

        @keyframes conflictPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .conflict-highlight { animation: conflictPulse 2s ease-in-out infinite; }
        .weight-bar-fill    { transition: width 0.5s ease; }
        .timeline-marker    { transition: all 0.2s ease; }
        .timeline-marker:hover { transform: scale(1.2); }
    </style>
</head>
<body class="h-full w-full text-white overflow-hidden">
    <div id="main-container" class="h-full w-full flex flex-col" style="background: rgba(20, 20, 30, 0.95);">
        <!-- 顶部标题栏 -->
        <div class="h-12 flex items-center justify-between px-4 border-b border-white/10 bg-gradient-to-r from-purple-500/10 to-pink-500/10 flex-shrink-0 drag-area select-none">
            <div class="flex items-center gap-3">
                <button onclick="goBack()" class="text-white/60 hover:text-white transition-colors no-drag" title="返回">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
                        <i class="fa-solid fa-chart-line text-sm"></i>
                    </div>
                    <span class="font-bold tracking-wide">多模态情感分析报告</span>
                </div>
            </div>
            <div class="flex items-center gap-4 no-drag text-xs">
                <span id="current-video-info" class="text-white/60">
                    <i class="fa-solid fa-video mr-1"></i>
                    <span id="current-bvid">--</span>
                </span>
                <button onclick="refreshData()" class="text-white/60 hover:text-white transition-colors" title="刷新数据">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button onclick="closeModule()" class="text-white/60 hover:text-red-400 transition-colors" title="关闭">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="flex-1 w-full p-6 overflow-y-auto">
            <!-- 视频信息卡片 -->
            <div id="video-info-card" class="glass-panel rounded-2xl p-6 mb-6">
                <div class="flex items-start justify-between">
                    <div>
                        <h2 id="video-title" class="text-xl font-bold mb-2">等待接收视频数据...</h2>
                        <div class="flex items-center gap-4 text-sm text-white/60">
                            <span><i class="fa-solid fa-hashtag mr-1"></i><span id="video-bvid">--</span></span>
                            <span><i class="fa-solid fa-calendar mr-1"></i><span id="video-pubdate">--</span></span>
                        </div>
                    </div>
                    <div class="text-center">
                        <div id="overall-score-ring" class="relative w-24 h-24">
                            <svg class="w-full h-full transform -rotate-90">
                                <circle cx="48" cy="48" r="40" stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="none"/>
                                <circle id="overall-score-circle" cx="48" cy="48" r="40" stroke="url(#scoreGradient)" stroke-width="8" fill="none"
                                        stroke-dasharray="251.2" stroke-dashoffset="251.2" class="transition-all duration-1000"/>
                                <defs>
                                    <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#a855f7"/>
                                        <stop offset="100%" stop-color="#ec4899"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span id="overall-score-text" class="text-2xl font-bold">--</span>
                            </div>
                        </div>
                        <div class="text-xs text-white/60 mt-1">综合情感</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-white/5 rounded-xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-sm text-white/80"><i class="fa-solid fa-comment mr-2"></i>文本情感</span>
                            <span id="text-score-badge" class="px-2 py-0.5 rounded-full text-xs bg-white/10">--</span>
                        </div>
                        <div class="weight-bar bg-white/10 rounded-full h-2 overflow-hidden">
                            <div id="text-weight-bar" class="weight-bar-fill bg-gradient-to-r from-blue-500 to-cyan-400 h-full" style="width: 70%"></div>
                        </div>
                        <div class="flex justify-between mt-1 text-xs text-white/40">
                            <span>得分: <span id="text-raw-score">--</span></span>
                            <span>权重: <span id="text-weight-value">70%</span></span>
                        </div>
                    </div>
                    <div class="bg-white/5 rounded-xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-sm text-white/80"><i class="fa-solid fa-microphone mr-2"></i>音频情感</span>
                            <span id="audio-score-badge" class="px-2 py-0.5 rounded-full text-xs bg-white/10">--</span>
                        </div>
                        <div class="weight-bar bg-white/10 rounded-full h-2 overflow-hidden">
                            <div id="audio-weight-bar" class="weight-bar-fill bg-gradient-to-r from-purple-500 to-pink-400 h-full" style="width: 30%"></div>
                        </div>
                        <div class="flex justify-between mt-1 text-xs text-white/40">
                            <span>得分: <span id="audio-raw-score">--</span></span>
                            <span>权重: <span id="audio-weight-value">30%</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 时间轴注意力权重图表 -->
            <div class="glass-panel rounded-2xl p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-semibold flex items-center">
                        <i class="fa-solid fa-chart-area mr-2 text-purple-400"></i>
                        时间轴注意力权重分析
                    </h3>
                    <div class="flex items-center gap-3 text-xs">
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-blue-500 mr-1"></span>文本</span>
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-pink-500 ml-2 mr-1"></span>音频</span>
                        <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-gradient-to-r from-blue-500 to-pink-500 ml-2 mr-1"></span>综合</span>
                    </div>
                </div>
                <div id="timeline-chart" class="w-full h-64"></div>
                
                <!-- 动态权重调整 -->
                <div class="mt-4 p-4 bg-white/5 rounded-xl">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-sm text-white/80"><i class="fa-solid fa-sliders mr-2"></i>动态权重调整</span>
                        <button onclick="resetWeights()" class="text-xs px-3 py-1 bg-white/10 hover:bg-white/20 rounded-lg transition-colors">重置</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-white/60 mb-1 block">文本权重: <span id="manual-text-weight">70%</span></label>
                            <input type="range" id="text-weight-slider" min="0" max="100" value="70"
                                   class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-purple-500"
                                   oninput="updateManualWeight('text', this.value)">
                        </div>
                        <div>
                            <label class="text-xs text-white/60 mb-1 block">音频权重: <span id="manual-audio-weight">30%</span></label>
                            <input type="range" id="audio-weight-slider" min="0" max="100" value="30"
                                   class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-pink-500"
                                   oninput="updateManualWeight('audio', this.value)">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 情感冲突检测 -->
            <div class="glass-panel rounded-2xl p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-semibold flex items-center">
                        <i class="fa-solid fa-triangle-exclamation mr-2 text-orange-400"></i>
                        情感冲突检测
                    </h3>
                    <span id="conflict-count" class="px-3 py-1 bg-orange-500/20 text-orange-400 rounded-full text-xs">
                        检测到 0 处冲突
                    </span>
                </div>
                
                <!-- 冲突严重程度概览 -->
                <div class="grid grid-cols-4 gap-3 mb-4">
                    <div class="text-center p-3 bg-white/5 rounded-xl">
                        <div id="severity-low-count" class="text-2xl font-bold text-yellow-400">0</div>
                        <div class="text-xs text-white/60">轻微冲突</div>
                    </div>
                    <div class="text-center p-3 bg-white/5 rounded-xl">
                        <div id="severity-medium-count" class="text-2xl font-bold text-orange-400">0</div>
                        <div class="text-xs text-white/60">中等冲突</div>
                    </div>
                    <div class="text-center p-3 bg-white/5 rounded-xl">
                        <div id="severity-high-count" class="text-2xl font-bold text-red-400">0</div>
                        <div class="text-xs text-white/60">严重冲突</div>
                    </div>
                    <div class="text-center p-3 bg-white/5 rounded-xl">
                        <div id="severity-critical-count" class="text-2xl font-bold text-red-600">0</div>
                        <div class="text-xs text-white/60">极度冲突</div>
                    </div>
                </div>

                <!-- 冲突详情列表 -->
                <div id="conflict-details" class="space-y-2">
                    <div class="text-center py-8 text-white/40 text-sm">
                        暂无冲突数据
                    </div>
                </div>
            </div>

            <!-- 情感分布雷达图 -->
            <div class="glass-panel rounded-2xl p-6">
                <h3 class="font-semibold flex items-center mb-4">
                    <i class="fa-solid fa-chart-pie mr-2 text-pink-400"></i>
                    多模态情感分布
                </h3>
                <div class="grid grid-cols-2 gap-6">
                    <div id="text-emotion-chart" class="w-full h-80"></div>
                    <div id="audio-emotion-chart" class="w-full h-80"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/shared.js"></script>
    <script>
        const { ipcRenderer } = require('electron');
        // API_BASE → shared.js

        // 全局状态
        let currentBvId = null;
        let currentVideoTitle = null;
        let multimodalData = null;
        let timelineChart = null;
        let textEmotionChart = null;
        let audioEmotionChart = null;
        let manualTextWeight = 70;
        let manualAudioWeight = 30;

        // 页面加载
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[OverallReports] 页面加载完成');
            initCharts();
            setupIpcListeners();
            
            // 临时调试：自动打开开发者工具
            setTimeout(() => {
                console.log('[OverallReports] 请求打开开发者工具');
                ipcRenderer.send('open-devtools');
            }, 1500);
            
            // 兜底：定期请求当前视频ID（每3秒请求一次，直到收到数据）
            console.log('[OverallReports] 开始监听视频变化...');
            const requestVideoId = () => {
                console.log('[OverallReports] 请求当前视频ID, currentBvId:', currentBvId);
                ipcRenderer.send('get-current-video-id');
            };
            
            // 等待 1 秒后开始请求（给主窗口时间准备好）
            setTimeout(() => {
                if (!currentBvId) {
                    console.log('[OverallReports] 未收到视频ID，开始请求');
                    requestVideoId();  // 立即请求一次
                    
                    const intervalId = setInterval(() => {
                        console.log('[OverallReports] 轮询检查 currentBvId:', currentBvId);
                        if (currentBvId) {
                            clearInterval(intervalId);  // 收到视频ID后停止请求
                        } else {
                            requestVideoId();
                        }
                    }, 3000);
                    
                    // 显示提示
                    const videoTitleEl = document.getElementById('video-title');
                    if (videoTitleEl) videoTitleEl.textContent = '请在主窗口播放视频';
                } else {
                    console.log('[OverallReports] 已有视频ID:', currentBvId);
                }
            }, 1000);
        });

        // applyTheme() + loadThemeFromConfig() → shared.js
        ipcRenderer.on('apply-ui-settings', (event, settings) => {
            applyTheme(settings.bgColor, settings.opacity);
        });

        // 初始化图表
        function initCharts() {
            timelineChart = echarts.init(document.getElementById('timeline-chart'));
            textEmotionChart = echarts.init(document.getElementById('text-emotion-chart'));
            audioEmotionChart = echarts.init(document.getElementById('audio-emotion-chart'));
            
            window.addEventListener('resize', () => {
                timelineChart && timelineChart.resize();
                textEmotionChart && textEmotionChart.resize();
                audioEmotionChart && audioEmotionChart.resize();
            });
        }

        // IPC 监听
        function setupIpcListeners() {
            ipcRenderer.on('video-change', (event, data) => {
                console.log('[OverallReports] 收到 video-change 事件:', data);
                let bvId, title;
                if (typeof data === 'object' && data !== null) {
                    bvId = data.bvId;
                    title = data.title;
                } else {
                    bvId = data;
                    title = null;
                }
                
                console.log('[OverallReports] 解析后的 bvId:', bvId, 'title:', title);
                
                if (bvId && bvId !== '--') {
                    currentBvId = bvId;
                    currentVideoTitle = title;
                    updateVideoInfo(bvId, title);
                    console.log('[OverallReports] 开始加载多模态数据:', bvId);
                    loadMultimodalData(bvId);
                } else {
                    console.log('[OverallReports] bvId 无效，跳过');
                }
            });
        }

        // 更新视频信息
        function updateVideoInfo(bvId, title) {
            document.getElementById('current-bvid').textContent = bvId || '--';
            document.getElementById('video-bvid').textContent = bvId || '--';
            document.getElementById('video-title').textContent = title || '等待接收视频数据...';
            
            if (title) {
                document.getElementById('video-title').textContent = title;
            }
        }

        // 加载多模态数据
        async function loadMultimodalData(bvId) {
            console.log('[OverallReports] loadMultimodalData 被调用, bvId:', bvId);
            try {
                const apiUrl = `${API_BASE}/api/video/multimodal-emotion/${bvId}/`;
                console.log('[OverallReports] 请求API:', apiUrl);
                const response = await fetch(apiUrl);
                const result = await response.json();
                console.log('[OverallReports] API响应:', result);
                
                if (result.success) {
                    multimodalData = result;
                    console.log('[OverallReports] 数据加载成功, 渲染报表');
                    renderMultimodalReport();
                } else {
                    // 如果API不存在，使用模拟数据
                    console.log('[OverallReports] API返回失败, 使用模拟数据进行演示, error:', result.error);
                    simulateData();
                    renderMultimodalReport();
                }
            } catch (error) {
                console.error('[OverallReports] 加载多模态数据失败:', error);
                // 降级到模拟数据
                simulateData();
                renderMultimodalReport();
            }
        }

        // 模拟数据（用于演示）
        function simulateData() {
            const timePoints = 10;
            const timeSegments = [];
            
            for (let i = 0; i < timePoints; i++) {
                timeSegments.push({
                    time: i * 60, // 秒
                    textScore: 0.3 + Math.random() * 0.5,
                    audioScore: 0.3 + Math.random() * 0.5,
                    textWeight: 0.6 + Math.random() * 0.2,
                    audioWeight: 0.2 + Math.random() * 0.2
                });
            }
            
            // 生成一些冲突点
            const conflicts = [];
            timeSegments.forEach((seg, idx) => {
                const diff = Math.abs(seg.textScore - seg.audioScore);
                if (diff > 0.3) {
                    conflicts.push({
                        time: seg.time,
                        duration: 60,
                        severity: diff > 0.5 ? 'critical' : (diff > 0.4 ? 'high' : 'medium'),
                        textScore: seg.textScore,
                        audioScore: seg.audioScore
                    });
                }
            });
            
            multimodalData = {
                overallScore: 0.65 + Math.random() * 0.2,
                textScore: 0.7 + Math.random() * 0.2,
                audioScore: 0.55 + Math.random() * 0.3,
                timeSegments: timeSegments,
                conflicts: conflicts,
                textEmotions: {
                    positive: 0.45 + Math.random() * 0.2,
                    neutral: 0.25 + Math.random() * 0.15,
                    negative: 0.2 + Math.random() * 0.15
                },
                audioEmotions: {
                    happy: 0.2 + Math.random() * 0.2,
                    neutral: 0.3 + Math.random() * 0.2,
                    sad: 0.15 + Math.random() * 0.15,
                    angry: 0.1 + Math.random() * 0.15,
                    fearful: 0.05 + Math.random() * 0.1,
                    surprise: 0.05 + Math.random() * 0.1
                }
            };
        }

        // 渲染多模态报告
        function renderMultimodalReport() {
            if (!multimodalData) return;
            
            renderOverallScore();
            renderTimelineChart();
            renderEmotionCharts();
            renderConflicts();
        }

        // 渲染综合得分
        function renderOverallScore() {
            const score = multimodalData.overallScore;
            const percentage = Math.round(score * 100);
            
            // 更新环形进度条
            const circumference = 2 * Math.PI * 40;
            const offset = circumference * (1 - score);
            document.getElementById('overall-score-circle').style.strokeDashoffset = offset;
            document.getElementById('overall-score-text').textContent = percentage + '%';
            
            // 更新得分badge
            const textBadge = document.getElementById('text-score-badge');
            const audioBadge = document.getElementById('audio-score-badge');
            
            textBadge.textContent = multimodalData.textScore > 0.6 ? '正面' : (multimodalData.textScore < 0.4 ? '负面' : '中立');
            textBadge.className = `px-2 py-0.5 rounded-full text-xs ${
                multimodalData.textScore > 0.6 ? 'bg-green-500/30 text-green-400' :
                multimodalData.textScore < 0.4 ? 'bg-red-500/30 text-red-400' :
                'bg-yellow-500/30 text-yellow-400'
            }`;
            
            // 简单判断音频情感
            const audioDominant = Object.entries(multimodalData.audioEmotions)
                .sort((a, b) => b[1] - a[1])[0][0];
            audioBadge.textContent = {
                'happy': '开心', 'neutral': '中立', 'sad': '悲伤',
                'angry': '愤怒', 'fearful': '恐惧', 'surprise': '惊讶'
            }[audioDominant] || '中立';
            
            // 更新权重条
            const textWeight = manualTextWeight / 100;
            const audioWeight = manualAudioWeight / 100;
            document.getElementById('text-weight-bar').style.width = `${textWeight * 100}%`;
            document.getElementById('audio-weight-bar').style.width = `${audioWeight * 100}%`;
            document.getElementById('text-weight-value').textContent = `${Math.round(textWeight * 100)}%`;
            document.getElementById('audio-weight-value').textContent = `${Math.round(audioWeight * 100)}%`;
            document.getElementById('text-raw-score').textContent = multimodalData.textScore.toFixed(2);
            document.getElementById('audio-raw-score').textContent = multimodalData.audioScore.toFixed(2);
        }

        // 渲染时间轴图表
        function renderTimelineChart() {
            if (!timelineChart || !multimodalData) return;
            
            const segments = multimodalData.timeSegments;
            const times = segments.map(s => formatTime(s.time));
            const textScores = segments.map(s => s.textScore);
            const audioScores = segments.map(s => s.audioScore);
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(20, 20, 30, 0.9)',
                    borderColor: 'rgba(255,255,255,0.1)',
                    textStyle: { color: '#fff' }
                },
                legend: {
                    data: ['文本情感', '音频情感'],
                    textStyle: { color: 'rgba(255,255,255,0.6)' },
                    top: 5
                },
                grid: {
                    left: '5%', right: '5%', top: 40, bottom: 25,
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: times,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.5)' }
                },
                yAxis: {
                    type: 'value',
                    min: 0, max: 1,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.5)' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [
                    {
                        name: '文本情感',
                        type: 'line',
                        data: textScores,
                        smooth: true,
                        lineStyle: { color: '#3b82f6', width: 3 },
                        itemStyle: { color: '#3b82f6' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(59, 130, 246, 0.4)' },
                                { offset: 1, color: 'rgba(59, 130, 246, 0.05)' }
                            ])
                        }
                    },
                    {
                        name: '音频情感',
                        type: 'line',
                        data: audioScores,
                        smooth: true,
                        lineStyle: { color: '#ec4899', width: 3 },
                        itemStyle: { color: '#ec4899' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(236, 72, 153, 0.4)' },
                                { offset: 1, color: 'rgba(236, 72, 153, 0.05)' }
                            ])
                        }
                    }
                ]
            };
            
            timelineChart.setOption(option);
        }

        // 渲染情感分布图表
        function renderEmotionCharts() {
            // 文本情感饼图（3个类别）
            const textOption = {
                backgroundColor: 'transparent',
                title: {
                    text: '文本情感分布',
                    left: 'center',
                    top: 8,
                    textStyle: { color: '#fff', fontSize: 13 }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {d}%'
                },
                legend: {
                    orient: 'vertical',
                    right: '2%',
                    top: 'middle',
                    textStyle: { color: 'rgba(255,255,255,0.7)', fontSize: 11 },
                    itemWidth: 10,
                    itemHeight: 10
                },
                series: [{
                    type: 'pie',
                    radius: ['38%', '62%'],
                    center: ['40%', '55%'],
                    avoidLabelOverlap: true,
                    itemStyle: {
                        borderRadius: 5,
                        borderColor: 'rgba(20, 20, 30, 0.8)',
                        borderWidth: 2
                    },
                    label: { show: false },
                    labelLine: { show: false },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 12,
                            fontWeight: 'bold',
                            color: '#fff',
                            formatter: '{b}\n{d}%'
                        }
                    },
                    data: [
                        { value: multimodalData.textEmotions.positive, name: '正面', itemStyle: { color: '#22c55e' } },
                        { value: multimodalData.textEmotions.neutral, name: '中立', itemStyle: { color: '#eab308' } },
                        { value: multimodalData.textEmotions.negative, name: '负面', itemStyle: { color: '#ef4444' } }
                    ]
                }]
            };

            // 音频情感饼图（6个类别）
            const audioOption = {
                backgroundColor: 'transparent',
                title: {
                    text: '音频情感分布',
                    left: 'center',
                    top: 8,
                    textStyle: { color: '#fff', fontSize: 13 }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {d}%'
                },
                legend: {
                    orient: 'vertical',
                    right: '2%',
                    top: 'middle',
                    textStyle: { color: 'rgba(255,255,255,0.7)', fontSize: 10 },
                    itemWidth: 8,
                    itemHeight: 8
                },
                series: [{
                    type: 'pie',
                    radius: ['35%', '58%'],
                    center: ['38%', '55%'],
                    avoidLabelOverlap: true,
                    itemStyle: {
                        borderRadius: 5,
                        borderColor: 'rgba(20, 20, 30, 0.8)',
                        borderWidth: 2
                    },
                    label: { show: false },
                    labelLine: { show: false },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 11,
                            fontWeight: 'bold',
                            color: '#fff',
                            formatter: '{b}\n{d}%'
                        }
                    },
                    data: [
                        { value: multimodalData.audioEmotions.happy, name: '开心', itemStyle: { color: '#fbbf24' } },
                        { value: multimodalData.audioEmotions.neutral, name: '中立', itemStyle: { color: '#94a3b8' } },
                        { value: multimodalData.audioEmotions.sad, name: '悲伤', itemStyle: { color: '#60a5fa' } },
                        { value: multimodalData.audioEmotions.angry, name: '愤怒', itemStyle: { color: '#f87171' } },
                        { value: multimodalData.audioEmotions.fearful, name: '恐惧', itemStyle: { color: '#a78bfa' } },
                        { value: multimodalData.audioEmotions.surprise, name: '惊讶', itemStyle: { color: '#2dd4bf' } }
                    ]
                }]
            };

            textEmotionChart.setOption(textOption);
            audioEmotionChart.setOption(audioOption);
        }

        // 渲染冲突检测
        function renderConflicts() {
            const conflicts = multimodalData.conflicts || [];
            
            // 更新冲突计数
            const counts = {
                low: conflicts.filter(c => c.severity === 'low').length,
                medium: conflicts.filter(c => c.severity === 'medium').length,
                high: conflicts.filter(c => c.severity === 'high').length,
                critical: conflicts.filter(c => c.severity === 'critical').length
            };
            
            document.getElementById('severity-low-count').textContent = counts.low;
            document.getElementById('severity-medium-count').textContent = counts.medium;
            document.getElementById('severity-high-count').textContent = counts.high;
            document.getElementById('severity-critical-count').textContent = counts.critical;
            document.getElementById('conflict-count').textContent = `检测到 ${conflicts.length} 处冲突`;
            
            // 更新冲突详情列表
            const container = document.getElementById('conflict-details');
            if (conflicts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-white/40 text-sm">
                        <i class="fa-solid fa-check-circle text-green-400 text-2xl mb-2"></i>
                        <div>未检测到明显的情感冲突</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = conflicts.map(conf => `
                <div class="bg-white/5 rounded-xl p-4 border-l-4 ${
                    conf.severity === 'critical' ? 'border-red-600' :
                    conf.severity === 'high' ? 'border-red-400' :
                    conf.severity === 'medium' ? 'border-orange-400' :
                    'border-yellow-400'
                }">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="font-mono text-sm">${formatTime(conf.time)}</span>
                            <span class="px-2 py-0.5 rounded-full text-xs ${
                                conf.severity === 'critical' ? 'bg-red-500/30 text-red-400' :
                                conf.severity === 'high' ? 'bg-red-400/30 text-red-300' :
                                conf.severity === 'medium' ? 'bg-orange-500/30 text-orange-400' :
                                'bg-yellow-500/30 text-yellow-400'
                            }">${
                                conf.severity === 'critical' ? '极度冲突' :
                                conf.severity === 'high' ? '严重冲突' :
                                conf.severity === 'medium' ? '中等冲突' :
                                '轻微冲突'
                            }</span>
                        </div>
                        <span class="text-xs text-white/40">持续 ${conf.duration}秒</span>
                    </div>
                    <div class="flex items-center gap-4 text-sm">
                        <span class="text-blue-400">文本: ${(conf.textScore * 100).toFixed(0)}%</span>
                        <span class="text-pink-400">音频: ${(conf.audioScore * 100).toFixed(0)}%</span>
                        <span class="text-white/60">差异: ${Math.abs(conf.textScore - conf.audioScore).toFixed(2)}</span>
                    </div>
                </div>
            `).join('');
        }

        // 辅助函数
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateManualWeight(type, value) {
            if (type === 'text') {
                manualTextWeight = parseInt(value);
                manualAudioWeight = 100 - manualTextWeight;
                document.getElementById('manual-text-weight').textContent = value + '%';
                document.getElementById('manual-audio-weight').textContent = manualAudioWeight + '%';
                document.getElementById('audio-weight-slider').value = manualAudioWeight;
            } else {
                manualAudioWeight = parseInt(value);
                manualTextWeight = 100 - manualAudioWeight;
                document.getElementById('manual-audio-weight').textContent = value + '%';
                document.getElementById('manual-text-weight').textContent = manualTextWeight + '%';
                document.getElementById('text-weight-slider').value = manualTextWeight;
            }
            
            // 实时更新图表
            if (multimodalData) {
                renderOverallScore();
                renderTimelineChart();
            }
        }

        function resetWeights() {
            manualTextWeight = 70;
            manualAudioWeight = 30;
            document.getElementById('text-weight-slider').value = 70;
            document.getElementById('audio-weight-slider').value = 30;
            document.getElementById('manual-text-weight').textContent = '70%';
            document.getElementById('manual-audio-weight').textContent = '30%';
            
            if (multimodalData) {
                renderOverallScore();
                renderTimelineChart();
            }
        }

        function applyDynamicWeights() {
            showToast('权重已应用', 'success');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('main-container');
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-4 py-2 rounded-lg text-sm ${
                type === 'success' ? 'bg-green-500/80' : 
                type === 'warning' ? 'bg-yellow-500/80' : 
                'bg-blue-500/80'
            }`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function goBack() {
            ipcRenderer.send('go-back');
        }

        function refreshData() {
            if (currentBvId) {
                loadMultimodalData(currentBvId);
                showToast('数据已刷新', 'success');
            }
        }

        function closeModule() {
            ipcRenderer.send('close-module', 'overall-reports');
        }
    </script>
</body>
</html>
